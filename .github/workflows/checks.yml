# Fixture-backed behavior, spec conformance and conventions on each platform.
# Windows transport cases explicitly skip without their hardware; a hosted
# runner cannot establish physical monitor compatibility.
name: checks

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install shellcheck
      - run: cd macos && make test

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          cd windows\tests
          .\run.ps1
          exit $LASTEXITCODE
