# display-switch — the shared contract
#
# This file is the single source of truth for both platforms. Code is not shared
# between macOS and Windows (IOAVService vs NVAPI), but this map is. Keep it here
# so the two implementations cannot silently drift apart.
#
# All values verified by direct testing on 2026-08-30, confirmed visually in both
# directions on both monitors, including from an inactive link.

# ---------------------------------------------------------------------------
# RULE: never verify a switch by reading a VCP value back.
#
# Reads are unreliable on both of these monitors and gave false negatives during
# testing:
#   * PG42UQ  — returns 0 for luminance/contrast/volume AND max luminance, always,
#               whether or not it is the active input. Writes still work.
#   * LG      — returns real values on a settled active link, but -7 while the link
#               is inactive or renegotiating. It read -7 immediately after a switch
#               that had in fact succeeded, then recovered to 100 once settled.
#
# Writes are fire-and-forget. Trust the screen, not the tool.
# ---------------------------------------------------------------------------

[machines]
mac     = "Mac Studio M4 Max"
windows = "Windows PC (RTX 4090)"

# ---------------------------------------------------------------------------

[[monitor]]
name         = "LG 45GX950A"
match_name   = "LG ULTRAGEAR+"   # as reported by `m1ddc display list`
edid_vendor  = 0x1e6d            # GSM / LG Electronics
edid_product = 0x9ea0

# Standard DDC/CI VCP 0x60 is STUBBED on this panel: writes return success and are
# ignored, and reads always return 0x0F regardless of the displayed input.
# Input control lives on LG's manufacturer sidechannel instead:
#   I2C source address 0x50  (standard is 0x51)
#   VCP code           0xF4  (standard is 0x60)
# m1ddc exposes this as `set input-alt`.
method = "lg-alt"

[monitor.input]
mac     = 0xD1   # 209 — USB-C.       NOTE: ddcutil's wiki calls 0xD1 "DisplayPort 2"
                 #       and lists USB-C as 0xD2. On this panel 0xD1 is correct and
                 #       0xD2 was never needed. Confirmed from both Windows and macOS.
windows = 0xD0   # 208 — DisplayPort
hdmi1   = 0x90   # 144 — unused, documented for completeness
hdmi2   = 0x91   # 145 — unused

# ---------------------------------------------------------------------------

[[monitor]]
name         = "ASUS PG42UQ"
match_name   = "PG42UQ"
edid_vendor  = 0x06b3            # AUS / ASUSTek
edid_product = 0x42e0

# Standard DDC/CI. Works normally.
method = "standard"              # VCP 0x60, I2C source address 0x51

[monitor.input]
mac     = 0x0F   # 15 — DisplayPort
windows = 0x11   # 17 — HDMI 1
hdmi2   = 0x12   # 18 — unused

# ---------------------------------------------------------------------------
# USB trigger: which device arriving means "this machine now owns the peripherals".
#
# The keyboard and mouse are wired directly to the Windows PC's motherboard and do
# NOT pass through the USB switch, so they cannot be the trigger. The devices that
# actually move are the webcam and the audio interface.
#
# Any listed device arriving fires a switch; the debounce below stops two arrivals
# from double-firing. Order matters only for documentation.
#
# Verify these IDs once the devices are actually behind the USB switch:
#   ioreg -p IOUSB -l | grep -E 'idVendor|idProduct'

[[trigger]]
name    = "Logitech Webcam C930e"
vendor  = 0x046D
product = 0x0843
primary = true
# Preferred anchor. A UVC camera enumerates on physical connection and little else,
# so it rarely produces a spurious arrival.

[[trigger]]
name    = "Focusrite Clarett+ 2Pre"
vendor  = 0x1235
product = 0x820A
primary = false
# Usable, but a weaker anchor: audio interfaces can re-enumerate on driver reloads,
# sample-rate changes and power events, and a spurious arrival here would yank both
# displays mid-session. If this interface ends up wired directly to one machine
# instead of passing through the switch, drop this entry.

[trigger.timing]
debounce_seconds = 3.0   # ignore any event within this window of the last switch
settle_seconds   = 0.75  # device must still be present after this delay before acting
