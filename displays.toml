# trigger-kvm -- reference values for the monitors this was developed against
#
# REFERENCE, NOT CONFIGURATION. Nothing reads this file at run time. Each
# computer's own config, written by `trigger-kvm configure`, holds which panels
# are on that desk and which input each computer is on. What lives here is the
# researched, cross-machine knowledge about a monitor MODEL: which method it
# needs, which VCP code carries its input, and which values are known safe.
#
# `method` only, never `transport`. What a MODEL needs is a fact about the panel
# and travels between desks; which API carries the bytes is a fact about the
# COMPUTER's adapters and does not. So a transport belongs in a machine's own
# config and never here -- and the one cross-machine consequence of the pair,
# that a transport with no I2C source byte cannot carry `lg-alt` at all, is
# enforced at each implementation's transport rather than written down as a
# value. See specs/config-format.md, "`transport` and `method` are different
# questions".
#
# It is the ALLOWLIST hard rule 1 (AGENTS.md) refers to. The dialect tables in
# both implementations -- DIALECT_* in macos/lib/answers.sh and $DIALECTS in
# windows/lib/answers.ps1 -- carry these values. A change here lands with the
# current platform's table; the other platform's table update goes into its
# HANDOFF.md for its owner to implement (AGENTS.md). Both test suites assert
# the exact packets below.
#
# Hard rule 2 applies to everything here: never verify a switch by reading a VCP
# value back. Reads lie on both of these panels (docs/measurements.md, "DDC
# reads"). Confirm by looking.
#
# Each value below says how it was confirmed. "both platforms" means watched
# from the Apple Silicon and Windows switchers; "instrument" means watched from
# the Intel measuring instrument only (docs/decisions/004); "documented" means
# never sent from anything here.

# ---------------------------------------------------------------------------

[[monitor]]
name           = "LG 45GX950A"
edid_name      = "LG ULTRAGEAR+"   # descriptor 0xFC, as `trigger-kvm list` prints it
edid_vendor    = 0x1E6D            # GSM / LG Electronics
osd_auto_input = "Auto Input Switch"   # MUST be OFF. On, the panel defects to the
                                       # other live input when the computer driving
                                       # it sleeps; off, it holds. Not controllable
                                       # from software.

# This panel does NOT have one EDID product id. It reports a different one per
# input (four consecutive values measured on one panel, one per physical path),
# so there is no single correct value and it cannot be a shared constant. The
# INPUT decides the value, not the host: two different Macs on the same input
# read the same id. A host may only use the value it measures on ITS OWN input,
# and must never copy one from another host or another cable. The EDID serial is
# stable across inputs; the id, the EDID's length and the CoreGraphics UUID
# derived from the id are not. The ASUS below shows no such behaviour.
edid_product   = "per-input; use what `trigger-kvm list` shows on this computer"

# Standard DDC/CI VCP 0x60 is STUBBED on this panel: writes return success and are
# ignored; reads return 0x0F whatever is displayed. Input control lives on LG's
# manufacturer sidechannel instead:
#   I2C source address 0x50  (standard is 0x51)   -- a service channel
#   VCP code           0xF4  (standard is 0x60)
# m1ddc exposes this as `set input-alt`; on Windows the packet is injected through
# NVAPI, aimed at the one output whose EDID vendor is 0x1E6D.
#
# The exact bytes (checksum = 0x6E XOR every preceding byte):
#   LG -> DisplayPort   50 84 03 F4 00 D0 9D
#   LG -> USB-C         50 84 03 F4 00 D1 9C
method = "lg-alt"

[monitor.input]
displayport = 0xD0   # 208 -- both platforms, and the instrument
usb-c       = 0xD1   # 209 -- both platforms, and the instrument. ddcutil's wiki calls
                     #        0xD1 "DisplayPort 2" and lists USB-C as 0xD2; on this
                     #        panel 0xD1 is correct and 0xD2 was never needed.
hdmi1       = 0x90   # 144 -- documented
hdmi2       = 0x91   # 145 -- documented

# ---------------------------------------------------------------------------

[[monitor]]
name           = "ASUS PG42UQ"
edid_name      = "PG42UQ"
edid_vendor    = 0x06B3            # AUS / ASUSTek
edid_product   = 0x42E0            # the same on every input and both hosts
osd_auto_input = "Auto Input Detection"  # MUST be OFF. Named differently from the
                                         # LG's, but it does cover switching on
                                         # signal loss, not only at power-on.

# Standard DDC/CI, I2C source 0x51, VCP 0x60. Works normally. Answers DDC over its
# HDMI input as well as DisplayPort, including while displaying the other one.
#
# The exact bytes (checksum = 0x6E XOR every preceding byte):
#   ASUS -> DisplayPort   51 84 03 60 00 0F D7
#   ASUS -> HDMI 1        51 84 03 60 00 11 C9
method = "standard"

[monitor.input]
displayport = 0x0F   # 15 -- both platforms, and the instrument
hdmi1       = 0x11   # 17 -- both platforms
hdmi2       = 0x12   # 18 -- instrument only (2026-09-01, docs/measurements.md)
